<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Knuspr First Order Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* Layout: shop grid with a slide-in cart on the right; checkout is one page with headed sections and a sticky summary. */
:root{
  --bg:#fbf7f2; --surface:#ffffff; --ink:#1d1b19; --muted:#6b625a; --line:#ece7e1;
  --brand:#a8480f; --accent:#e8792f; --tint:#fdebdc; --tint2:#fff7f0;
  --good:#2f7a3b; --good-tint:#e4f1e6; --warn:#9a5b00; --warn-tint:#fff3d6;
  --shadow:0 16px 40px rgba(40,25,10,.16);
  --font:'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1714; --surface:#25201c; --ink:#f3ede7; --muted:#b3a89e; --line:#3a322b;
  --brand:#f08a43; --accent:#e8792f; --tint:#3d2a1c; --tint2:#2d231b;
  --good:#7cc489; --good-tint:#1f3324; --warn:#f0c062; --warn-tint:#3a2f17;
  --shadow:0 16px 40px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1b1714; --surface:#25201c; --ink:#f3ede7; --muted:#b3a89e; --line:#3a322b;
  --brand:#f08a43; --accent:#e8792f; --tint:#3d2a1c; --tint2:#2d231b;
  --good:#7cc489; --good-tint:#1f3324; --warn:#f0c062; --warn-tint:#3a2f17;
  --shadow:0 16px 40px rgba(0,0,0,.5); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--brand)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* prototype note */
.proto{background:var(--ink);color:var(--bg);font-size:13px}
.proto .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:7px;flex-wrap:wrap}
.proto button{background:transparent;border:1px solid currentColor;border-radius:6px;padding:3px 10px;color:inherit;font-size:13px}

/* header */
.strip{background:var(--tint);font-size:14px}
.strip .wrap{display:flex;justify-content:center;gap:10px 22px;flex-wrap:wrap;padding-block:9px;text-align:center}
.strip b{font-weight:600}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
header.top .wrap{display:flex;align-items:center;gap:20px;padding-block:12px}
.logo{font-weight:700;font-size:24px;letter-spacing:-.5px;color:var(--ink);display:flex;align-items:baseline;gap:2px}
.logo span{color:var(--accent)}
.addr{display:flex;flex-direction:column;font-size:13px;min-width:0}
.addr b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr small{color:var(--brand);font-weight:600;font-size:13px}
.search{flex:1;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;height:46px;min-width:0;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;font:inherit;color:var(--ink);flex:1;min-width:0}
.cartbtn{display:flex;align-items:center;gap:10px;background:transparent;border:0;padding:6px 4px;font-weight:700;font-size:16px}
.cartbtn .ic{position:relative;display:flex}
.badge{position:absolute;top:-7px;right:-9px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
@media (max-width:760px){.addr,.search{display:none} header.top .wrap{justify-content:space-between}}

/* shop */
main{padding-block:24px 64px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px}
h1,h2,h3{margin:0;text-wrap:balance}
.sechead h1{font-size:24px}
.sechead p{margin:0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pic{aspect-ratio:4/3;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:52px;max-width:100%}
.price{font-size:18px;font-weight:700}
.price small{font-size:12px;font-weight:500;color:var(--muted)}
.pname{font-weight:600;min-height:42px}
.unit{color:var(--muted);font-size:13px}
.tag{align-self:flex-start;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--tint);color:var(--brand)}
.add{margin-top:auto;height:40px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.step{margin-top:auto;display:flex;align-items:center;justify-content:space-between;height:40px;border-radius:10px;background:var(--tint)}
.step button{width:40px;height:40px;border:0;background:transparent;font-size:20px;font-weight:700;color:var(--brand)}
.step span{font-weight:700}
.step.sm{height:32px;margin:0;min-width:104px}
.step.sm button{width:32px;height:32px;font-size:17px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,12,6,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:50;box-shadow:var(--shadow);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:20px}
.x{width:36px;height:36px;border-radius:18px;border:0;background:var(--tint2);font-size:20px;line-height:1}
.dbody{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.dfoot{border-top:1px solid var(--line);padding:16px 20px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}

.goal{border-radius:14px;padding:14px;background:var(--tint2);border:1px solid var(--tint)}
.goal.done{background:var(--good-tint);border-color:transparent}
.goal .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.goal .row b{font-size:15px}
.bar{margin-top:10px;height:8px;border-radius:4px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .3s}
.goal.done .bar{background:rgba(47,122,59,.18)} .goal.done .bar i{background:var(--good)}
.goal p{margin:8px 0 0;font-size:13px;color:var(--muted)}
.fill{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}

.line{display:flex;align-items:center;gap:12px}
.thumb{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.line .info{flex:1;min-width:0}
.line .info b{display:block;font-weight:600;font-size:14px}
.line .info small{color:var(--muted);font-size:12.5px}
.line .amt{font-weight:700;min-width:84px;text-align:right}

.costs{display:flex;flex-direction:column;gap:6px;font-size:14px}
.costs div{display:flex;justify-content:space-between;gap:12px}
.costs .free{color:var(--good);font-weight:600}
.costs .off{color:var(--good);font-weight:600}
.costs .pending{color:var(--muted)}
.costs .total{font-size:17px;font-weight:700;padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.costs s{color:var(--muted);font-weight:400;margin-right:6px}
.hold{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;gap:10px}
.hold svg{flex-shrink:0;margin-top:1px}
.cta{height:52px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:16px;width:100%}
.cta[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed}
.ghost{height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:600;width:100%}

/* checkout */
.co{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
@media (max-width:900px){.co{grid-template-columns:minmax(0,1fr)}}
.back{background:none;border:0;padding:0;color:var(--brand);font-weight:600;margin-bottom:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sec + .sec{margin-top:16px}
.sec h2{font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec h2 .ok{font-size:13px;font-weight:600;color:var(--good);display:flex;align-items:center;gap:4px}
.sec h2 .need{font-size:13px;font-weight:600;color:var(--warn)}
.sec p{margin:0}
.days{display:flex;gap:8px;flex-wrap:wrap}
.day{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600}
.day.on{border-color:var(--brand);background:var(--tint2);color:var(--brand)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.slot b{font-size:15px}
.slot small{font-size:12.5px;color:var(--good);font-weight:600}
.slot.on{border-color:var(--brand);background:var(--tint2);box-shadow:inset 0 0 0 1px var(--brand)}
.slot[disabled]{opacity:.45;cursor:not-allowed}
.slot[disabled] small{color:var(--muted)}
.lines{display:flex;flex-direction:column;gap:12px}
.rm{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
.warn{background:var(--warn-tint);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pay label{border:1.5px solid var(--line);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.pay label:has(input:checked){border-color:var(--brand);background:var(--tint2)}
.pay input{accent-color:var(--brand)}
.voucher{display:flex;align-items:center;gap:10px;background:var(--good-tint);color:var(--good);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.voucher.wait{background:var(--tint2);color:var(--muted)}
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.summary h2{font-size:18px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0}

/* done */
.done{max-width:560px;margin:24px auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center}
.done .tick{width:64px;height:64px;border-radius:32px;background:var(--good-tint);display:flex;align-items:center;justify-content:center}
.done h1{font-size:26px}
.done p{margin:0;color:var(--muted)}
.done .costs{width:100%;text-align:left}
.snack{position:fixed;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;z-index:45;display:flex;flex-direction:column;gap:10px;animation:up .2s ease}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.snack{animation:none}}
@media (max-width:520px){.snack{left:16px;right:16px;width:auto}}
.snack .top1{display:flex;align-items:center;gap:10px}
.snack .thumb{width:36px;height:36px;font-size:20px;border-radius:8px}
.snack .what{flex:1;min-width:0;font-size:14px}
.snack .what b{display:block}
.snack .what span{color:var(--muted);font-size:13px}
.snack .view{border:0;background:transparent;color:var(--brand);font-weight:700;padding:6px 4px;white-space:nowrap}
.snack .prog{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.snack .prog b{color:var(--brand)}
.snack .bar{margin:0;height:6px}
.snack.done .prog b{color:var(--good)} .snack.done .bar{background:var(--good-tint)} .snack.done .bar i{background:var(--good)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:60}
</style>
</head>
<body>


<div class="proto"><div class="wrap"><span>Clickable prototype for a case study. Prices are examples; no order is placed and nothing is charged.</span><button type="button" id="reset">Start over as a first-time customer</button></div></div>
<div class="strip"><div class="wrap"><span><b>First delivery free</b></span><span>€39 minimum order</span><span><b>€20 off your first order,</b> applied in your cart</span></div></div>
<header class="top"><div class="wrap">
  <a class="logo" href="#" id="home" aria-label="Back to the shop">knuspr<span>.</span></a>
  <div class="addr"><b>Fritz-Werner-Straße 35</b><small>Delivery tomorrow from 6:00</small></div>
  <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search products" aria-label="Search products"></label>
  <button class="cartbtn" id="openCart" type="button"></button>
</div></header>

<main class="wrap" id="view"></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Your cart" aria-hidden="true">
  <div class="dhead"><h2>Your cart</h2><button class="x" id="closeCart" type="button" aria-label="Close cart">×</button></div>
  <div class="dbody" id="dbody"></div>
  <div class="dfoot" id="dfoot"></div>
</aside>
<div class="snack" id="snack" role="status" aria-live="polite" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const MIN = 39, WELCOME = 20, BUFFER = 0.15;
const P = [
 {id:'ban', n:'Bananas', u:'ca. 850 g · €1.79/kg', p:1.52, w:true, e:'🍌', c:'#fbf1cf'},
 {id:'cuc', n:'Cucumber', u:'1 pc', p:0.59, e:'🥒', c:'#e3f0dc'},
 {id:'app', n:'Pink Lady apples', u:'ca. 1 kg · €3.59/kg', p:3.59, w:true, e:'🍎', c:'#f8e1de'},
 {id:'pep', n:'Red peppers', u:'ca. 460 g · €2.99/kg', p:1.38, w:true, e:'🫑', c:'#f8e1de'},
 {id:'mil', n:'Fresh whole milk 3.5%', u:'1 l', p:1.29, e:'🥛', c:'#e6eef6'},
 {id:'egg', n:'Free-range eggs', u:'10 pc', p:3.49, e:'🥚', c:'#f6efe3'},
 {id:'bre', n:'Sourdough bread', u:'750 g', p:3.99, e:'🍞', c:'#f4e8d8'},
 {id:'gou', n:'Gouda, sliced', u:'400 g', p:3.79, e:'🧀', c:'#fbf1cf'},
 {id:'chi', n:'Chicken breast fillet', u:'ca. 500 g · €13.98/kg', p:6.99, w:true, e:'🍗', c:'#f8e1de'},
 {id:'yog', n:'Greek yogurt 10%', u:'1 kg', p:3.29, e:'🥣', c:'#e6eef6'},
 {id:'pas', n:'Knuspr organic penne', u:'500 g', p:1.49, e:'🍝', c:'#f6efe3', tag:'Own brand'},
 {id:'tom', n:'Tomato passata', u:'700 g', p:1.19, e:'🍅', c:'#f8e1de'},
 {id:'cof', n:'Coffee beans, crema', u:'1 kg', p:13.99, e:'☕', c:'#efe4da'},
 {id:'wat', n:'Sparkling water', u:'6 × 1.5 l', p:3.54, dep:1.50, e:'💧', c:'#e6eef6', tag:'+ €1.50 deposit'},
 {id:'avo', n:'Avocado, ready to eat', u:'2 pc', p:2.49, e:'🥑', c:'#e3f0dc'},
 {id:'cho', n:'Dark chocolate 70%', u:'100 g', p:1.89, e:'🍫', c:'#efe4da'},
];
const byId = Object.fromEntries(P.map(x=>[x.id,x]));
const START = {ban:1,cuc:1,mil:2,egg:1,bre:1,gou:1,chi:1,yog:1,pas:2};
const DAYS = [
  {k:'tue', label:'Tomorrow', date:'Tue 20 Oct'},
  {k:'wed', label:'Wednesday', date:'Wed 21 Oct'},
  {k:'thu', label:'Thursday', date:'Thu 22 Oct'},
];
const SLOTS = ['06:00–07:00','07:00–08:00','08:00–09:00','12:00–13:00','17:00–18:00','18:00–19:00','19:00–20:00','20:00–21:00'];
const FULL = {tue:['07:00–08:00','18:00–19:00'], wed:['19:00–20:00'], thu:[]};

let S;
function fresh(){ return {cart:{...START}, view:'shop', drawer:false, day:'tue', slot:null, pay:'card', q:''}; }
function load(){ try{ const s=JSON.parse(localStorage.getItem('kfo')); if(s&&s.cart) return {...fresh(),...s, drawer:false}; }catch(e){} return fresh(); }
function save(){ try{ localStorage.setItem('kfo', JSON.stringify({cart:S.cart, view:S.view, day:S.day, slot:S.slot, pay:S.pay})); }catch(e){} }
S = load();

const eur = v => '€' + v.toFixed(2);
function totals(){
  let items=0, weighed=0, dep=0, count=0;
  for(const [id,q] of Object.entries(S.cart)){ const x=byId[id]; if(!x||!q) continue; items+=x.p*q; count+=q; if(x.w) weighed+=x.p*q; if(x.dep) dep+=x.dep*q; }
  items=Math.round(items*100)/100;
  const reached = items >= MIN;
  const off = reached ? Math.min(WELCOME, items) : 0;
  const total = Math.round((items - off + dep)*100)/100;
  const hold = Math.round((total + weighed*BUFFER)*100)/100;
  return {items, weighed, dep, count, reached, off, total, hold, toGo: Math.max(0, Math.round((MIN-items)*100)/100)};
}

function stepper(id,q,cls=''){ return `<div class="step ${cls}"><button type="button" data-dec="${id}" aria-label="One less ${byId[id].n}">−</button><span class="num">${q}</span><button type="button" data-inc="${id}" aria-label="One more ${byId[id].n}">+</button></div>`; }
function priceHtml(x){ return `${x.w?'<small>ca. </small>':''}${eur(x.p)}`; }

function goalHtml(t){
  const pct = Math.min(100, t.items/MIN*100);
  if(t.reached) return `<div class="goal done"><div class="row"><b>You can order</b><span class="num">${eur(t.items)} of ${eur(MIN)}</span></div><div class="bar"><i style="width:100%"></i></div><p>Minimum reached. Your €20 welcome discount and free first delivery are applied.</p></div>`;
  const fillers = P.filter(x=>x.p>=Math.min(t.toGo,3) ).sort((a,b)=>Math.abs(a.p-t.toGo)-Math.abs(b.p-t.toGo)).slice(0,3);
  return `<div class="goal"><div class="row"><b class="num">${eur(t.toGo)} to go</b><span class="num">${eur(t.items)} of ${eur(MIN)} minimum</span></div><div class="bar"><i style="width:${pct}%"></i></div><p>At ${eur(MIN)} you can book a slot, delivery is free and €20 comes off.</p><div class="fill">${fillers.map(x=>`<button type="button" class="chip" data-inc="${x.id}">+ ${x.n} ${eur(x.p)}</button>`).join('')}</div></div>`;
}
function costsHtml(t, final){
  return `<div class="costs num">
    <div><span>Items (${t.count})</span><span>${t.weighed?'ca. ':''}${eur(t.items)}</span></div>
    ${t.dep?`<div><span>Bottle deposit</span><span>${eur(t.dep)}</span></div>`:''}
    <div><span>Delivery</span><span class="free">Free, first order</span></div>
    ${t.reached?`<div><span>Welcome discount</span><span class="off">−${eur(t.off)}</span></div>`:`<div class="pending"><span>Welcome discount</span><span>−€20.00 at €39</span></div>`}
    <div class="total"><span>${final?'You pay':'Total'}</span><span>${t.weighed?'ca. ':''}${eur(t.total)}</span></div>
  </div>`;
}
function holdHtml(t){
  if(!t.weighed) return `<div class="hold"><span>Nothing in your cart is weighed, so you pay exactly ${eur(t.total)}.</span></div>`;
  return `<div class="hold">${'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>'}<span>Fruit, veg and meat are weighed when we pack them, so the price can move a little. We reserve up to <b class="num">${eur(t.hold)}</b> on your card and charge the exact amount after packing, usually less.</span></div>`;
}

function renderHeader(t){
  document.getElementById('openCart').innerHTML = `<span class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l2.5 11h11L21 7H7"/></svg>${t.count?`<span class="badge num">${t.count}</span>`:''}</span><span class="num">${eur(t.items)}</span>`;
  document.getElementById('openCart').setAttribute('aria-label', `Open cart, ${t.count} items, ${eur(t.items)}`);
}

function renderShop(){
  const q=S.q.trim().toLowerCase();
  const list=P.filter(x=>!q||x.n.toLowerCase().includes(q));
  return `<div class="sechead"><h1>Popular this week</h1><p>Tap + to add. Open the cart any time from the top right.</p></div>
  <div class="grid">${list.map(x=>{const n=S.cart[x.id]||0; return `<article class="card"><div class="pic" style="background:${x.c}" aria-hidden="true">${x.e}</div>${x.tag?`<span class="tag">${x.tag}</span>`:''}<div class="price num">${priceHtml(x)}</div><div class="pname">${x.n}</div><div class="unit">${x.u}</div>${n?stepper(x.id,n):`<button type="button" class="add" data-add="${x.id}" aria-label="Add ${x.n}">+ Add</button>`}</article>`}).join('')}</div>
  ${list.length?'':'<p>No products match that search.</p>'}`;
}

function renderDrawer(t){
  const lines = Object.entries(S.cart).filter(([,q])=>q>0);
  document.getElementById('dbody').innerHTML = lines.length ? `${goalHtml(t)}
    <div class="lines">${lines.map(([id,q])=>{const x=byId[id]; return `<div class="line"><span class="thumb" style="background:${x.c}" aria-hidden="true">${x.e}</span><span class="info"><b>${x.n}</b><small>${x.u}</small></span>${stepper(id,q,'sm')}<span class="amt num">${x.w?'ca. ':''}${eur(x.p*q)}</span></div>`}).join('')}</div>
    ${costsHtml(t)}` : `<div class="goal"><div class="row"><b>Your cart is empty</b></div><p>Add a few things. At ${eur(MIN)} you can order, delivery is free and €20 comes off.</p></div>`;
  document.getElementById('dfoot').innerHTML = `${lines.length && t.weighed ? holdHtml(t) : ''}
    <button type="button" class="cta" id="toCheckout" ${t.reached?'':'disabled'}>${t.reached?`Go to checkout · <span class="num">${t.weighed?'ca. ':''}${eur(t.total)}</span>`:`Add ${eur(t.toGo)} to check out`}</button>`;
}

function renderCheckout(t){
  const lines = Object.entries(S.cart).filter(([,q])=>q>0);
  const full = FULL[S.day]||[];
  const day = DAYS.find(d=>d.k===S.day);
  const ready = t.reached && S.slot;
  return `<button type="button" class="back" data-go="shop">← Back to shopping</button>
  <div class="co">
    <div>
      <section class="sec" aria-labelledby="h-addr"><h2 id="h-addr">Delivery address <span class="ok">✓ Saved</span></h2>
        <p><b>Touba Shahzad</b><br>Fritz-Werner-Straße 35, 12107 Berlin<br><span style="color:var(--muted)">3rd floor · ring “Shahzad”</span></p></section>
      <section class="sec" aria-labelledby="h-slot"><h2 id="h-slot">Delivery time ${S.slot?`<span class="ok">✓ ${day.date}, ${S.slot}</span>`:'<span class="need">Choose a slot</span>'}</h2>
        <div class="days" role="tablist">${DAYS.map(d=>`<button type="button" role="tab" aria-selected="${d.k===S.day}" class="day ${d.k===S.day?'on':''}" data-day="${d.k}">${d.label}<br><small style="font-weight:500">${d.date}</small></button>`).join('')}</div>
        <div class="slots">${SLOTS.map(s=>{const off=full.includes(s); const on=S.slot===s&&!off; return `<button type="button" class="slot ${on?'on':''}" data-slot="${s}" ${off?'disabled':''} aria-pressed="${on}"><b class="num">${s}</b><small>${off?'Full':'Free, first order'}</small></button>`}).join('')}</div>
        <p style="font-size:13px;color:var(--muted)">Every slot shows its price before you pick it. You can add items until the evening before.</p></section>
      <section class="sec" aria-labelledby="h-items"><h2 id="h-items">Your items <span style="font-size:13px;color:var(--muted);font-weight:500">${t.count} items, still editable</span></h2>
        ${t.reached?'':`<div class="warn">You're ${eur(t.toGo)} under the €39 minimum. Add something to keep your slot and the €20 discount.</div>`}
        <div class="lines">${lines.map(([id,q])=>{const x=byId[id]; return `<div class="line"><span class="thumb" style="background:${x.c}" aria-hidden="true">${x.e}</span><span class="info"><b>${x.n}</b><small>${x.u}</small><br><button type="button" class="rm" data-rm="${id}">Remove</button></span>${stepper(id,q,'sm')}<span class="amt num">${x.w?'ca. ':''}${eur(x.p*q)}</span></div>`}).join('')}</div>
        <button type="button" class="ghost" data-go="shop" style="width:auto;padding:0 16px;align-self:flex-start">+ Add more items</button></section>
      <section class="sec" aria-labelledby="h-pay"><h2 id="h-pay">Payment</h2>
        <div class="pay">${[['card','Card'],['paypal','PayPal'],['gpay','Google Pay']].map(([k,l])=>`<label><input type="radio" name="pay" id="pay-${k}" value="${k}" ${S.pay===k?'checked':''}> ${l}</label>`).join('')}</div>
        ${t.reached?`<div class="voucher">✓ Welcome discount WELCOME20 applied: −${eur(t.off)}</div>`:`<div class="voucher wait">Welcome discount −€20.00 applies once you reach €39</div>`}
      </section>
    </div>
    <aside class="summary" aria-labelledby="h-sum"><h2 id="h-sum">Summary</h2>
      ${costsHtml(t,true)}
      ${holdHtml(t)}
      <button type="button" class="cta" id="place" ${ready?'':'disabled'}>Place order${ready?` · <span class="num">${t.weighed?'ca. ':''}${eur(t.total)}</span>`:''}</button>
      <p class="hint">${!t.reached?`Add ${eur(t.toGo)} to reach the €39 minimum.`:!S.slot?'Choose a delivery time to place your order.':`Delivery ${day.date}, ${S.slot}. Nothing is charged until we pack.`}</p>
    </aside>
  </div>`;
}

function renderDone(t){
  const day = DAYS.find(d=>d.k===S.day);
  return `<div class="done"><span class="tick"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--good)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
    <h1>Order placed</h1><p>Arriving ${day.date}, ${S.slot}, at Fritz-Werner-Straße 35.</p>
    ${costsHtml(t,true)}
    ${holdHtml(t)}
    <p style="font-size:13px">You can still add items until 22:00 the evening before. We'll email the final receipt after packing.</p>
    <button type="button" class="ghost" id="again" style="max-width:280px">Start over as a first-time customer</button></div>`;
}

function render(){
  const t=totals();
  renderHeader(t);
  const v=document.getElementById('view');
  if(S.view==='checkout' && Object.values(S.cart).every(q=>!q)) S.view='shop';
  v.innerHTML = S.view==='shop'?renderShop():S.view==='checkout'?renderCheckout(t):renderDone(t);
  renderDrawer(t);
  const d=document.getElementById('drawer');
  d.classList.toggle('on',S.drawer); d.setAttribute('aria-hidden',String(!S.drawer));
  document.getElementById('scrim').classList.toggle('on',S.drawer);
  save();
}

let snackT;
function snack(id){
  const x=byId[id], t=totals(), el=document.getElementById('snack');
  const pct=Math.min(100,t.items/MIN*100);
  el.className='snack'+(t.reached?' done':'');
  el.innerHTML=`<div class="top1"><span class="thumb" style="background:${x.c}" aria-hidden="true">${x.e}</span><span class="what"><b>${x.n} added</b><span class="num">Cart ${eur(t.items)} · ${t.count} items</span></span><button type="button" class="view" id="snackView">View cart</button><button type="button" class="x" id="snackClose" aria-label="Dismiss" style="width:28px;height:28px;font-size:16px">×</button></div>
  <div class="prog num">${t.reached?'<b>You can order now</b><span>Free delivery and −€20 applied</span>':`<b>${eur(t.toGo)} to go</b><span>${eur(t.items)} of ${eur(MIN)} minimum</span>`}</div>
  <div class="bar"><i style="width:${pct}%"></i></div>`;
  el.hidden=false; clearTimeout(snackT); snackT=setTimeout(()=>el.hidden=true,4500);
}
let toastT;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,1800); }
function change(id,d,quiet){
  const before=totals().reached;
  S.cart[id]=Math.max(0,(S.cart[id]||0)+d); if(!S.cart[id]) delete S.cart[id];
  const after=totals().reached;
  if(!before&&after&&!quiet) toast('Minimum reached: free delivery and −€20 applied');
  if(before&&!after&&S.view==='checkout') toast('Below the €39 minimum again');
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button,a'); if(!b) return;
  const ds=b.dataset;
  if(ds.add){ change(ds.add,1,true); render(); snack(ds.add); return; }
  if(ds.inc){ const inCard=!!b.closest('.card'); change(ds.inc,1,inCard); render(); if(inCard) snack(ds.inc); return; }
  if(ds.dec){ change(ds.dec,-1); render(); return; }
  if(ds.rm){ S.cart[ds.rm]=0; change(ds.rm,0); render(); return; }
  if(ds.day){ S.day=ds.day; if((FULL[S.day]||[]).includes(S.slot)) S.slot=null; render(); return; }
  if(ds.slot){ S.slot=ds.slot; render(); return; }
  if(ds.go){ S.view=ds.go; S.drawer=false; render(); window.scrollTo(0,0); return; }
  switch(b.id){
    case 'snackView': document.getElementById('snack').hidden=true; S.drawer=true; render(); break;
    case 'snackClose': document.getElementById('snack').hidden=true; break;
    case 'openCart': document.getElementById('snack').hidden=true; S.drawer=true; render(); break;
    case 'closeCart': S.drawer=false; render(); break;
    case 'toCheckout': S.view='checkout'; S.drawer=false; render(); window.scrollTo(0,0); break;
    case 'place': S.view='done'; render(); window.scrollTo(0,0); break;
    case 'home': e.preventDefault(); S.view='shop'; render(); break;
    case 'reset': case 'again': S=fresh(); render(); window.scrollTo(0,0); toast('Fresh first-time cart loaded'); break;
  }
});
document.getElementById('scrim').addEventListener('click',()=>{S.drawer=false;render();});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.drawer){S.drawer=false;render();} });
document.addEventListener('change',e=>{ if(e.target.name==='pay'){ S.pay=e.target.value; save(); } });
document.getElementById('q').addEventListener('input',e=>{ S.q=e.target.value; if(S.view!=='shop') S.view='shop'; document.getElementById('view').innerHTML=renderShop(); });
render();
</script>

</body>
</html>
