<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Knuspr First Order Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* Layout: shop grid with a slide-in cart on the right; checkout is one page with headed sections and a sticky summary. */
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#222222; --muted:#6e6e6e; --line:#e6e6e6;
  --brand:#c9600f; --accent:#ef7d1a; --tint:#ffeedd; --tint2:#fff7ef; --pic:#f4f4f4; --soft:#f6f6f6;
  --good:#2f7a3b; --good-tint:#e4f1e6; --warn:#9a5b00; --warn-tint:#fff3d6;
  --shadow:0 16px 40px rgba(40,25,10,.16);
  --logo-ink:#3C3C3B; --logo-mute:#878787;
  --font:'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161616; --logo-ink:#f2f2f2; --logo-mute:#a8a8a8; --surface:#1f1f1f; --ink:#f2f2f2; --muted:#a8a8a8; --line:#333333;
  --brand:#ff9a45; --accent:#ef7d1a; --tint:#3a2614; --tint2:#2a2019; --pic:#2a2a2a; --soft:#242424;
  --good:#7cc489; --good-tint:#1f3324; --warn:#f0c062; --warn-tint:#3a2f17;
  --shadow:0 16px 40px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#161616; --logo-ink:#f2f2f2; --logo-mute:#a8a8a8; --surface:#1f1f1f; --ink:#f2f2f2; --muted:#a8a8a8; --line:#333333;
  --brand:#ff9a45; --accent:#ef7d1a; --tint:#3a2614; --tint2:#2a2019; --pic:#2a2a2a; --soft:#242424;
  --good:#7cc489; --good-tint:#1f3324; --warn:#f0c062; --warn-tint:#3a2f17;
  --shadow:0 16px 40px rgba(0,0,0,.5); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--brand)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* prototype note */
.proto{background:var(--ink);color:var(--bg);font-size:13px}
.proto .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:7px;flex-wrap:wrap}
.proto button{background:transparent;border:1px solid currentColor;border-radius:6px;padding:3px 10px;color:inherit;font-size:13px}

/* header */
.strip{background:var(--tint2);font-size:14px;border-bottom:1px solid var(--tint)}
.strip .wrap{display:flex;justify-content:center;align-items:center;gap:10px 22px;flex-wrap:wrap;padding-block:8px;text-align:center;line-height:1.3}
.strip .wrap>span{display:inline-flex;align-items:center;gap:6px}
.strip b{font-weight:600}
header.top{background:var(--surface)}
.shopbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
header.top .wrap{display:flex;align-items:center;gap:20px;padding-block:10px}
header.top .hrow1{padding-block:10px 4px}
.shopbar .hrow2{display:flex;align-items:center;padding-block:10px 12px;gap:14px}
.hspace{flex:1}
.xtra{display:flex;align-items:center;gap:12px;padding:7px 14px 7px 8px;border:1.5px solid #f2cfae;border-radius:12px;background:var(--tint2);color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.xtra:hover{border-color:var(--accent)}
.xtra .xb{height:30px;padding:0 10px;border-radius:8px;background:#a8480f;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center}
.xtra .xt{display:flex;flex-direction:column;gap:1px}.xtra .xt b{font-size:14px}.xtra .xt small{font-size:12.5px;color:var(--muted)}
.xtra svg{color:var(--brand)}
.avatar{width:40px;height:40px;border-radius:20px;border:0;background:#3a2a1d;color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.catbtn{display:flex;align-items:center;gap:10px;height:48px;padding:0 18px;border:1.5px solid #a8480f;border-radius:12px;background:var(--surface);color:var(--brand);font:inherit;font-weight:600;font-size:16px;cursor:pointer;flex-shrink:0}
.recbtn{display:flex;align-items:center;gap:8px;border:0;background:transparent;font:inherit;font-weight:600;font-size:16px;color:var(--ink);padding:10px 8px;cursor:pointer;flex-shrink:0}
.recbtn svg{color:var(--brand)}
.shopbar .search{height:48px}
.logo{font-weight:700;font-size:24px;letter-spacing:-.5px;color:var(--ink);display:flex;align-items:baseline;gap:2px}
.logo span{color:var(--accent)}
.addr{display:flex;flex-direction:column;align-items:flex-start;font-size:13px;min-width:0;border:0;background:transparent;padding:6px 26px 6px 8px;margin-left:-8px;border-radius:10px;text-align:left;color:var(--ink);position:relative;cursor:pointer}
.addr:hover{background:var(--soft)}
.addr::after{content:"";position:absolute;right:10px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-50%) rotate(-45deg)}
.addr b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr small{color:var(--brand);font-weight:600;font-size:13px}
.search{flex:1;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;height:46px;min-width:0;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;font:inherit;color:var(--ink);flex:1;min-width:0}
.cartbtn{display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:0;padding:2px 6px;font-weight:700;font-size:14px;line-height:1.2}
.cartbtn .camt{font-size:14px;font-weight:700}
.badge.ok{background:#22c55e;color:#0b2e16}
.cartbtn .ic{position:relative;display:flex}
.cartbtn .amt2{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.mini{width:84px;height:4px;border-radius:2px;background:var(--tint);overflow:hidden;display:block}
.mini i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.mini.done i{background:#22c55e}
:root[data-theme="dark"] .snack{box-shadow:0 0 0 1px #3a3a3a,0 14px 36px rgba(0,0,0,.5)}
.cartpage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
@media (max-width:900px){.cartpage{grid-template-columns:minmax(0,1fr)}}
.cartpage .lines{gap:0}
.cartpage .line{padding:14px 0;border-bottom:1px solid var(--line)}
.cartpage .thumb{width:72px;height:72px;font-size:38px}
.cartacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.cartacts button{height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-weight:600}
.badge{position:absolute;top:-7px;right:-9px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
@media (max-width:900px){.xtra .xt{display:none}}
@media (max-width:760px){.xtra,.recbtn span{display:none} .catbtn{padding:0 12px;font-size:0;gap:0} .shopbar .hrow2{gap:8px}}

/* shop */
main{padding-block:24px 64px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px}
h1,h2,h3{margin:0;text-wrap:balance}
.sechead h1{font-size:24px}
.sechead p{margin:0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pic{position:relative;background:#fff;aspect-ratio:1/1;border-radius:12px;display:flex;align-items:center;justify-content:center;max-width:100%;overflow:hidden}
.pic img{width:88%;height:88%;object-fit:contain}
.price{font-size:18px;font-weight:700}
.price small{font-size:12px;font-weight:500;color:var(--muted)}
.pname{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.unit{color:var(--muted);font-size:13px}
.tag{align-self:flex-start;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--tint);color:var(--brand)}
.add{margin-top:auto;height:40px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.step{margin-top:auto;display:flex;align-items:center;justify-content:space-between;height:40px;border-radius:10px;background:var(--tint)}
.step button{width:40px;height:40px;border:0;background:transparent;font-size:20px;font-weight:700;color:var(--brand)}
.step span{font-weight:700}
.step.sm{height:32px;margin:0;min-width:104px}
.step.sm button{width:32px;height:32px;font-size:17px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,12,6,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:50;box-shadow:var(--shadow);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dhead{padding:14px 16px 14px 20px}
.tocart{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px 8px 8px;text-align:left}
.tocart .ic{position:relative;width:44px;height:44px;border-radius:10px;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.tocart b{font-size:20px;display:block;line-height:1.1}
.tocart small{color:var(--muted);font-size:12.5px}
.tocart:hover{border-color:var(--accent)}
.x{width:36px;height:36px;border-radius:18px;border:0;background:var(--tint2);font-size:20px;line-height:1}
.dbody{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.dfoot{border-top:1px solid var(--line);padding:16px 20px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}

.goal{border-radius:12px;padding:12px 14px;background:var(--tint2);border:1px solid var(--tint)}
.okline{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--good);background:var(--good-tint);border-radius:10px;padding:8px 12px}
.dtotal{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dtotal b{font-size:18px}
.dtotal .amt{white-space:nowrap}.dtotal .ca{font-size:13px;font-weight:600;color:var(--muted);margin-right:4px}
.dmsg{margin:-6px 0 0;font-size:13px;color:var(--muted);line-height:1.4}.dmsg.g{color:var(--good);font-weight:600}
.cta.alt{background:var(--tint2);color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cta.alt:hover{background:var(--tint)}
.dtotal small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.dtotal .g{color:var(--good)}
.rec{margin-top:28px}
.rec h2{font-size:20px;margin-bottom:12px}
.rec .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.fab{position:fixed;right:max(24px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;border-radius:32px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 10px 28px rgba(0,0,0,.25);z-index:35;text-align:left}
.fab .dot{width:38px;height:38px;border-radius:19px;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center}
.fab b{display:block;font-size:15px}.fab small{font-size:12.5px;opacity:.8}
@media (max-width:520px){.fab small{display:none}}
.goal.done{background:var(--good-tint);border-color:transparent}
.goal .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.goal .row b{font-size:15px}
.bar{margin-top:8px;height:8px;border-radius:4px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .3s}
.goal.done .bar{background:rgba(47,122,59,.18)} .goal.done .bar i{background:var(--good)}
.goal p{margin:8px 0 0;font-size:13px;color:var(--muted)}
.fill{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.fill .lbl{font-size:13px;color:var(--muted);white-space:nowrap;align-self:center}
.chip{white-space:nowrap;flex-shrink:0;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}

.line{display:flex;align-items:center;gap:12px}
.thumb{background:#fff!important;border:1px solid var(--line);overflow:hidden;width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.line .info{flex:1;min-width:0}
.line .info b{display:block;font-weight:600;font-size:14px}
.line .info small{color:var(--muted);font-size:12.5px}
.line .amt{font-weight:700;min-width:84px;text-align:right}

.costs{display:flex;flex-direction:column;gap:6px;font-size:14px}
.costs div{display:flex;justify-content:space-between;gap:12px}
.costs .free{color:var(--good);font-weight:600}
.costs .off{color:var(--good);font-weight:600}
.costs .pending{color:var(--muted)}
.costs .total{font-size:17px;font-weight:700;padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.costs s{color:var(--muted);font-weight:400;margin-right:6px}
.hold{font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;gap:10px}
.hold svg{flex-shrink:0;margin-top:1px}
.cta{height:52px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;width:100%}
.cta[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed}
.ghost{height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:600;width:100%}

/* checkout */
.co{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
@media (max-width:900px){.co{grid-template-columns:minmax(0,1fr)}}
.back{background:none;border:0;padding:0;color:var(--brand);font-weight:600;margin-bottom:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sec + .sec{margin-top:16px}
.sec h2{font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec h2 .ok{font-size:13px;font-weight:600;color:var(--good);display:flex;align-items:center;gap:4px}
.sec h2 .need{font-size:13px;font-weight:600;color:var(--warn)}
.sec p{margin:0}
.days{display:flex;gap:8px;flex-wrap:wrap}
.day{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600}
.day.on{border-color:var(--accent);background:var(--tint2);color:var(--brand)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.slot b{font-size:15px}
.slot small{font-size:12.5px;color:var(--good);font-weight:600}
.slot.on{border-color:var(--accent);background:var(--tint2);box-shadow:inset 0 0 0 1px var(--accent)}
.slot[disabled]{opacity:.45;cursor:not-allowed}
.slot[disabled] small{color:var(--muted)}
.lines{display:flex;flex-direction:column;gap:12px}
.rm{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
.warn{background:var(--warn-tint);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pay label{border:1.5px solid var(--line);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.pay label:has(input:checked){border-color:var(--accent);background:var(--tint2)}
.pay input{accent-color:var(--accent)}
.ticket{position:relative;display:flex;align-items:stretch;border:1.5px dashed var(--accent);border-radius:12px;background:var(--tint2);overflow:hidden}
.ticket::before,.ticket::after{content:"";position:absolute;left:77px;width:14px;height:14px;border-radius:7px;background:var(--surface);border:1.5px dashed var(--accent)}
.ticket::before{top:-9px}.ticket::after{bottom:-9px}
.ticket .val small{font-size:12px;font-weight:600;margin-left:3px}
.ticket .val{width:84px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--brand);border-right:1.5px dashed var(--accent)}
.ticket .txt{padding:9px 12px;font-size:13px;display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0}
.ticket .txt b{font-size:14px}
.ticket .txt span{color:var(--muted)}
.ticket.on{border-color:var(--good);background:var(--good-tint)}
.ticket.on::before,.ticket.on::after{border-color:var(--good)}
.ticket.on .val{color:var(--good);border-color:var(--good)}
.ticket.on .txt span{color:var(--good)}
.stripv{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--accent);border-radius:8px;padding:3px 10px;background:var(--surface);color:var(--brand)}
.voucher{display:flex;align-items:center;gap:10px;background:var(--good-tint);color:var(--good);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.voucher.wait{background:var(--tint2);color:var(--muted)}
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.summary h2{font-size:18px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0}

/* done */
.orderdone{max-width:560px;margin:24px auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center}
.orderdone .tick{width:64px;height:64px;border-radius:32px;background:var(--good-tint);display:flex;align-items:center;justify-content:center}
.orderdone h1{font-size:26px}
.orderdone p{margin:0;color:var(--muted)}
.orderdone .costs{width:100%;text-align:left}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:60}
.snack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));width:min(760px,calc(100% - 32px));background:#1f1f1f;color:#fff;border-radius:18px;box-shadow:0 14px 36px rgba(0,0,0,.28);padding:14px 16px 14px 24px;z-index:45;display:flex;align-items:center;gap:20px;animation:up .2s ease}
@keyframes snackup{from{opacity:0;margin-bottom:-12px}to{opacity:1;margin-bottom:0}}
.snack{animation:snackup .2s ease}
@media (prefers-reduced-motion:reduce){.snack{animation:none}.snack .fillb{transition:none}}
.snack .msg{flex:1;min-width:0;font-size:17px;line-height:1.3}
.snack .msg b{font-weight:700}
.snack .msub{display:block;font-size:14px;color:#c9c4bf;margin-top:2px}

/* prototype note */
.proto{background:var(--ink);color:var(--bg);font-size:13px}
.proto .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:7px;flex-wrap:wrap}
.proto button{background:transparent;border:1px solid currentColor;border-radius:6px;padding:3px 10px;color:inherit;font-size:13px}

/* header */
.strip{background:var(--tint2);font-size:14px;border-bottom:1px solid var(--tint)}
.strip .wrap{display:flex;justify-content:center;align-items:center;gap:10px 22px;flex-wrap:wrap;padding-block:8px;text-align:center;line-height:1.3}
.strip .wrap>span{display:inline-flex;align-items:center;gap:6px}
.strip b{font-weight:600}
header.top{background:var(--surface)}
.shopbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
header.top .wrap{display:flex;align-items:center;gap:20px;padding-block:10px}
header.top .hrow1{padding-block:10px 4px}
.shopbar .hrow2{display:flex;align-items:center;padding-block:10px 12px;gap:14px}
.hspace{flex:1}
.xtra{display:flex;align-items:center;gap:12px;padding:7px 14px 7px 8px;border:1.5px solid #f2cfae;border-radius:12px;background:var(--tint2);color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.xtra:hover{border-color:var(--accent)}
.xtra .xb{height:30px;padding:0 10px;border-radius:8px;background:#a8480f;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center}
.xtra .xt{display:flex;flex-direction:column;gap:1px}.xtra .xt b{font-size:14px}.xtra .xt small{font-size:12.5px;color:var(--muted)}
.xtra svg{color:var(--brand)}
.favbtn{position:relative;width:40px;height:40px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex-shrink:0;padding:0}.favbtn:hover{border-color:var(--accent);color:var(--accent)}.favbtn .badge{position:absolute;top:-5px;right:-6px}
.avatar{width:40px;height:40px;border-radius:20px;border:0;background:#3a2a1d;color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.catbtn{display:flex;align-items:center;gap:10px;height:48px;padding:0 18px;border:1.5px solid #a8480f;border-radius:12px;background:var(--surface);color:var(--brand);font:inherit;font-weight:600;font-size:16px;cursor:pointer;flex-shrink:0}
.shopbar .search{height:48px}
.logo{font-weight:700;font-size:24px;letter-spacing:-.5px;color:var(--ink);display:flex;align-items:baseline;gap:2px}
.logo span{color:var(--accent)}
.addr{display:flex;flex-direction:column;align-items:flex-start;font-size:13px;min-width:0;border:0;background:transparent;padding:6px 26px 6px 8px;margin-left:-8px;border-radius:10px;text-align:left;color:var(--ink);position:relative;cursor:pointer}
.addr:hover{background:var(--soft)}
.addr::after{content:"";position:absolute;right:10px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-50%) rotate(-45deg)}
.addr b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr small{color:var(--brand);font-weight:600;font-size:13px}
.search{flex:1;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;height:46px;min-width:0;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;font:inherit;color:var(--ink);flex:1;min-width:0}
.cartbtn{display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:0;padding:2px 6px;font-weight:700;font-size:14px;line-height:1.2}
.cartbtn .camt{font-size:14px;font-weight:700}
.badge.ok{background:#22c55e;color:#0b2e16}
.cartbtn .ic{position:relative;display:flex}
.cartbtn .amt2{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.mini{width:84px;height:4px;border-radius:2px;background:var(--tint);overflow:hidden;display:block}
.mini i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.mini.done i{background:#22c55e}
:root[data-theme="dark"] .snack{box-shadow:0 0 0 1px #3a3a3a,0 14px 36px rgba(0,0,0,.5)}
.cartpage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
@media (max-width:900px){.cartpage{grid-template-columns:minmax(0,1fr)}}
.cartpage .lines{gap:0}
.cartpage .line{padding:14px 0;border-bottom:1px solid var(--line)}
.cartpage .thumb{width:72px;height:72px;font-size:38px}
.cartacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.cartacts button{height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-weight:600}
.badge{position:absolute;top:-7px;right:-9px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
@media (max-width:900px){.xtra .xt{display:none}}
@media (max-width:760px){.xtra{display:none} .catbtn{padding:0 12px;font-size:0;gap:0} .shopbar .hrow2{gap:8px}}

/* shop */
main{padding-block:24px 64px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px}
h1,h2,h3{margin:0;text-wrap:balance}
.sechead h1{font-size:24px}
.sechead p{margin:0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pic{position:relative;background:#fff;aspect-ratio:1/1;border-radius:12px;display:flex;align-items:center;justify-content:center;max-width:100%;overflow:hidden}
.pic img{width:88%;height:88%;object-fit:contain}
.price{font-size:18px;font-weight:700}
.price small{font-size:12px;font-weight:500;color:var(--muted)}
.pname{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.unit{color:var(--muted);font-size:13px}
.tag{align-self:flex-start;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--tint);color:var(--brand)}
.add{margin-top:auto;height:40px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.step{margin-top:auto;display:flex;align-items:center;justify-content:space-between;height:40px;border-radius:10px;background:var(--tint)}
.step button{width:40px;height:40px;border:0;background:transparent;font-size:20px;font-weight:700;color:var(--brand)}
.step span{font-weight:700}
.step.sm{height:32px;margin:0;min-width:104px}
.step.sm button{width:32px;height:32px;font-size:17px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,12,6,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:50;box-shadow:var(--shadow);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dhead{padding:14px 16px 14px 20px}
.tocart{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px 8px 8px;text-align:left}
.tocart .ic{position:relative;width:44px;height:44px;border-radius:10px;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.tocart b{font-size:20px;display:block;line-height:1.1}
.tocart small{color:var(--muted);font-size:12.5px}
.tocart:hover{border-color:var(--accent)}
.x{width:36px;height:36px;border-radius:18px;border:0;background:var(--tint2);font-size:20px;line-height:1}
.dbody{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.dfoot{border-top:1px solid var(--line);padding:16px 20px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}

.goal{border-radius:12px;padding:12px 14px;background:var(--tint2);border:1px solid var(--tint)}
.okline{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--good);background:var(--good-tint);border-radius:10px;padding:8px 12px}
.dtotal{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dtotal b{font-size:18px}
.dtotal .amt{white-space:nowrap}.dtotal .ca{font-size:13px;font-weight:600;color:var(--muted);margin-right:4px}
.dmsg{margin:-6px 0 0;font-size:13px;color:var(--muted);line-height:1.4}.dmsg.g{color:var(--good);font-weight:600}
.cta.alt{background:var(--tint2);color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cta.alt:hover{background:var(--tint)}
.dtotal small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.dtotal .g{color:var(--good)}
.rec{margin-top:28px}
.rec h2{font-size:20px;margin-bottom:12px}
.rec .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.fab{position:fixed;right:max(24px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;border-radius:32px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 10px 28px rgba(0,0,0,.25);z-index:35;text-align:left}
.fab .dot{width:38px;height:38px;border-radius:19px;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center}
.fab b{display:block;font-size:15px}.fab small{font-size:12.5px;opacity:.8}
@media (max-width:520px){.fab small{display:none}}
.goal.done{background:var(--good-tint);border-color:transparent}
.goal .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.goal .row b{font-size:15px}
.bar{margin-top:8px;height:8px;border-radius:4px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .3s}
.goal.done .bar{background:rgba(47,122,59,.18)} .goal.done .bar i{background:var(--good)}
.goal p{margin:8px 0 0;font-size:13px;color:var(--muted)}
.fill{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.fill .lbl{font-size:13px;color:var(--muted);white-space:nowrap;align-self:center}
.chip{white-space:nowrap;flex-shrink:0;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}

.line{display:flex;align-items:center;gap:12px}
.thumb{background:#fff!important;border:1px solid var(--line);overflow:hidden;width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.line .info{flex:1;min-width:0}
.line .info b{display:block;font-weight:600;font-size:14px}
.line .info small{color:var(--muted);font-size:12.5px}
.line .amt{font-weight:700;min-width:84px;text-align:right}

.costs{display:flex;flex-direction:column;gap:6px;font-size:14px}
.costs div{display:flex;justify-content:space-between;gap:12px}
.costs .free{color:var(--good);font-weight:600}
.costs .off{color:var(--good);font-weight:600}
.costs .pending{color:var(--muted)}
.costs .total{font-size:17px;font-weight:700;padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.costs s{color:var(--muted);font-weight:400;margin-right:6px}
.hold{font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;gap:10px}
.hold svg{flex-shrink:0;margin-top:1px}
.cta{height:52px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;width:100%}
.cta[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed}
.ghost{height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:600;width:100%}

/* checkout */
.co{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
@media (max-width:900px){.co{grid-template-columns:minmax(0,1fr)}}
.back{background:none;border:0;padding:0;color:var(--brand);font-weight:600;margin-bottom:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sec + .sec{margin-top:16px}
.sec h2{font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec h2 .ok{font-size:13px;font-weight:600;color:var(--good);display:flex;align-items:center;gap:4px}
.sec h2 .need{font-size:13px;font-weight:600;color:var(--warn)}
.sec p{margin:0}
.days{display:flex;gap:8px;flex-wrap:wrap}
.day{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600}
.day.on{border-color:var(--accent);background:var(--tint2);color:var(--brand)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.slot b{font-size:15px}
.slot small{font-size:12.5px;color:var(--good);font-weight:600}
.slot.on{border-color:var(--accent);background:var(--tint2);box-shadow:inset 0 0 0 1px var(--accent)}
.slot[disabled]{opacity:.45;cursor:not-allowed}
.slot[disabled] small{color:var(--muted)}
.lines{display:flex;flex-direction:column;gap:12px}
.rm{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
.warn{background:var(--warn-tint);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pay label{border:1.5px solid var(--line);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.pay label:has(input:checked){border-color:var(--accent);background:var(--tint2)}
.pay input{accent-color:var(--accent)}
.ticket{position:relative;display:flex;align-items:stretch;border:1.5px dashed var(--accent);border-radius:12px;background:var(--tint2);overflow:hidden}
.ticket::before,.ticket::after{content:"";position:absolute;left:77px;width:14px;height:14px;border-radius:7px;background:var(--surface);border:1.5px dashed var(--accent)}
.ticket::before{top:-9px}.ticket::after{bottom:-9px}
.ticket .val small{font-size:12px;font-weight:600;margin-left:3px}
.ticket .val{width:84px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--brand);border-right:1.5px dashed var(--accent)}
.ticket .txt{padding:9px 12px;font-size:13px;display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0}
.ticket .txt b{font-size:14px}
.ticket .txt span{color:var(--muted)}
.ticket.on{border-color:var(--good);background:var(--good-tint)}
.ticket.on::before,.ticket.on::after{border-color:var(--good)}
.ticket.on .val{color:var(--good);border-color:var(--good)}
.ticket.on .txt span{color:var(--good)}
.stripv{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--accent);border-radius:8px;padding:3px 10px;background:var(--surface);color:var(--brand)}
.voucher{display:flex;align-items:center;gap:10px;background:var(--good-tint);color:var(--good);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.voucher.wait{background:var(--tint2);color:var(--muted)}
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.summary h2{font-size:18px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0}

/* done */
.orderdone{max-width:560px;margin:24px auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center}
.orderdone .tick{width:64px;height:64px;border-radius:32px;background:var(--good-tint);display:flex;align-items:center;justify-content:center}
.orderdone h1{font-size:26px}
.orderdone p{margin:0;color:var(--muted)}
.orderdone .costs{width:100%;text-align:left}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:60}
.snack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));width:min(760px,calc(100% - 32px));background:#1f1f1f;color:#fff;border-radius:18px;box-shadow:0 14px 36px rgba(0,0,0,.28);padding:14px 16px 14px 24px;z-index:45;display:flex;align-items:center;gap:20px;animation:up .2s ease}
@keyframes snackup{from{opacity:0;margin-bottom:-12px}to{opacity:1;margin-bottom:0}}
.snack{animation:snackup .2s ease}
@media (prefers-reduced-motion:reduce){.snack{animation:none}.snack .fillb{transition:none}}
.snack .msg{flex:1;min-width:0;font-size:17px;line-height:1.3}
.snack .msg b{font-weight:700}
.snack .msub{display:block;font-size:14px;color:#c9c4bf;margin-top:2px}
.snack .view{border:0;background:transparent;color:#ffb37a;font-weight:700;padding:4px 0;margin-left:6px;font-size:15px}
.snack .track{position:relative;flex:0 0 300px;height:40px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 2px #fff;overflow:hidden}
.snack .fillb{position:absolute;inset:2px auto 2px 2px;min-width:84px;border-radius:18px;background:var(--accent);display:flex;align-items:center;padding-left:14px;color:#fff;font-weight:700;font-size:16px;white-space:nowrap;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.snack .goalv{position:absolute;right:16px;top:50%;transform:translateY(-50%);z-index:2;color:#1d1b19;font-weight:700;font-size:16px}
.snack .fillb{z-index:1}
.snack.done .goalv{display:none}
.snack{border-top:4px solid var(--accent)}
.snack.done{border-top-color:#22c55e}
:root[data-theme="dark"] .snack{background:#ffffff;color:#1d1b19;box-shadow:0 14px 36px rgba(0,0,0,.55)}
:root[data-theme="dark"] .snack .msub{color:#6e6e6e}
:root[data-theme="dark"] .snack .view{color:#c9600f}
:root[data-theme="dark"] .snack .track{background:#ececec;box-shadow:inset 0 0 0 2px #ececec}
.snack.done .fillb{background:#22c55e;color:#0b2e16}
@media (max-width:640px){.snack{flex-direction:column;align-items:stretch;gap:10px;padding:14px 16px;bottom:calc(96px + env(safe-area-inset-bottom,0px))}.snack .track{flex-basis:auto}.snack .msg{font-size:15px}}
.sumrow{display:flex;align-items:flex-start;gap:14px}
.sumic{width:40px;height:40px;border-radius:20px;background:var(--tint2);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sumtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sumtxt b{font-size:15px}.sumtxt span{font-size:14.5px}.sumtxt small{font-size:13px;color:var(--muted)}.sumtxt .g{color:var(--good);font-weight:600}
.editb{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px;color:var(--brand)}
.editb:hover{border-color:var(--accent)}
.mscrim{position:fixed;inset:0;background:rgba(20,12,6,.45);z-index:70}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:min(720px,calc(100% - 48px));background:var(--surface);border-radius:20px;box-shadow:var(--shadow);z-index:71;display:flex;flex-direction:column}
@media (max-width:600px){.modal{top:auto;bottom:0;transform:translateX(-50%);width:100%;border-radius:20px 20px 0 0;max-height:88%;padding-bottom:env(safe-area-inset-bottom,0px)}}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:19px}

function totals(){
  let items=0, weighed=0, dep=0, count=0;
  for(const [id,q] of Object.entries(S.cart)){ const x=byId[id]; if(!x||!q) continue; items+=x.p*q; count+=q; if(x.w) weighed+=x.p*q; if(x.dep) dep+=x.dep*q; }
  items=Math.round(items*100)/100;
  const reached = items >= MIN;
  const off = reached ? Math.min(WELCOME, items) : 0;
  const total = Math.round((items - off + dep)*100)/100;
  const hold = Math.round((total + weighed*BUFFER)*100)/100;
  const cartTotal = Math.round((items + dep)*100)/100;
  return {items, weighed, dep, count, reached, off, total, hold, cartTotal, toGo: Math.max(0, Math.round((MIN-items)*100)/100)};
}

    body=S.adding?`<form id="contactF" class="nform" novalidate><h3>${ed?'Edit contact':'New contact'}</h3>

    <p class="mnote">Every slot shows its price before you pick it. You can add items until the evening before.</p>`;

function openModal(m){ S.modal=m; S.adding=false; S.editId=null; S.editCid=null; S.draft={cid:S.cid, addr:S.addr, pay:S.pay, day:S.day, sday:S.day, slot:S.slot}; render(); setTimeout(()=>{const f=document.querySelector('#modal .modal input:checked, #modal .modal .slot.on, #modal .modal button'); f&&f.focus();},0); }
function closeModal(){ const m=S.modal; S.modal=null; S.adding=false; render(); const b=document.querySelector(`[data-edit="${m}"],[data-info="${m}"]`); b&&b.focus(); }
function render(){
  const t=totals();
  renderHeader(t);
  const v=document.getElementById('view');
  if(S.view==='checkout' && Object.values(S.cart).every(q=>!q)) S.view='shop';
  v.innerHTML = S.view==='shop'?renderShop():S.view==='cart'?renderCart(t):S.view==='checkout'?renderCheckout(t):renderDone(t);
  renderDrawer(t);
  document.getElementById('modal').innerHTML=modalHtml();
  const d=document.getElementById('drawer');
  d.classList.toggle('on',S.drawer); d.setAttribute('aria-hidden',String(!S.drawer));
  document.getElementById('scrim').classList.toggle('on',S.drawer);
  save();
}

function setTheme(m){ document.documentElement.dataset.theme=m; const b=document.getElementById('themeBtn'); b.textContent=m==='dark'?'Light mode':'Dark mode'; b.setAttribute('aria-pressed',String(m==='dark')); try{localStorage.setItem('kfo-theme',m);}catch(e){} }
(function(){ let m='light'; try{ m=localStorage.getItem('kfo-theme')||'light'; }catch(e){} setTheme(m); })();
let snackT;
function snack(id){
  const x=byId[id], t=totals(), el=document.getElementById('snack');
  const pct=Math.min(100,t.items/MIN*100);
  el.className='snack'+(t.reached?' done':'');
  const prev=Math.min(100,Math.max(0,(t.items-x.p)/MIN*100));
  const w=v=>`calc(${v}% - 4px)`;
  el.innerHTML=`<div class="msg num">${t.reached?`<b>Minimum reached.</b> You get free delivery and your €20 first-order discount at checkout.<button type="button" class="view" id="snackView">View cart</button>`:`Still <b>${eur(t.toGo)}</b> to the €${MIN} minimum order.<span class="msub">Reach it for free delivery and your €20 first-order discount at checkout.</span>`}</div>
  <div class="track num" role="img" aria-label="${eur(t.items)} of ${eur(MIN)}"><span class="goalv">${eur(MIN).replace('.00','')}</span><span class="fillb" id="snackFill" style="width:${w(prev)}">${eur(t.items)}</span></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const f=document.getElementById('snackFill'); if(f) f.style.width=w(pct);}));
  el.hidden=false; clearTimeout(snackT); snackT=setTimeout(()=>el.hidden=true,5000);
}
let toastT;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,1800); }
function change(id,d,quiet){
  const before=totals().reached;
  S.cart[id]=Math.max(0,(S.cart[id]||0)+d); if(!S.cart[id]) delete S.cart[id];
  const after=totals().reached;
  if(!before&&after&&!quiet) toast('Minimum reached: free delivery and your €20 first-order discount at checkout');
  if(before&&!after&&S.view==='checkout') toast('Below the €39 minimum again');
}

document.addEventListener('click',e=>{
  const im=e.target.closest('[data-pdimg]'); if(im && !e.target.closest('button')){ openPd(im.dataset.pdimg); return; }
  const b=e.target.closest('button,a'); if(!b) return;
  const ds=b.dataset;
  if(ds.add){ change(ds.add,1,true); render(); snack(ds.add); return; }
  if(ds.inc){ const inCard=!!b.closest('.card'); change(ds.inc,1,inCard); render(); if(inCard) snack(ds.inc); return; }
  if(ds.dec){ change(ds.dec,-1); render(); return; }
  if(ds.rm){ S.cart[ds.rm]=0; change(ds.rm,0); render(); return; }
  if(ds.day){ S.day=ds.day; if((FULL[S.day]||[]).includes(S.slot)) S.slot=null; render(); return; }
  if(ds.slot){ S.slot=ds.slot; render(); return; }
  if(ds.go){ S.view=ds.go; S.drawer=false; render(); window.scrollTo(0,0); return; }
  if(ds.fav){ S.favs=S.favs||{}; S.favs[ds.fav]=!S.favs[ds.fav]; render(); toast(S.favs[ds.fav]?'Added to your favourites':'Removed from your favourites'); document.querySelector(`[data-fav="${ds.fav}"]`)?.focus(); return; }
  if(ds.pd){ openPd(ds.pd); return; }
  if(ds.pairadd){ change(ds.pairadd,1,true); render(); toast(byId[ds.pairadd].n+' added'); return; }
  if(ds.edit){ openModal(ds.edit); return; }
  if(ds.quick){ const q=QUICK[ds.quick]; S.dmode=ds.quick; S.day=q.day; S.slot=q.slot; closeModal(); toast('Delivery time updated'); return; }
  if(ds.info){ openModal(ds.info); S.lastInfo=ds.info; return; }
  if(ds.ect){ S.adding=true; S.editCid=ds.ect; render(); setTimeout(()=>document.getElementById('ct-first')?.focus(),0); return; }
  if(ds.eaddr){ S.adding=true; S.editId=ds.eaddr; render(); setTimeout(()=>document.getElementById('na-street')?.focus(),0); return; }
  if(ds.mday){ S.draft.day=ds.mday; render(); return; }
  if(ds.mslot){ S.draft.slot=ds.mslot; S.draft.sday=S.draft.day; render(); return; }
  switch(b.id){
    case 'modalClose': closeModal(); break;
    case 'modalClose2': closeModal(); break;
    case 'pdInc': S.pdQty++; render(); document.getElementById('pdInc')?.focus(); break;
    case 'pdDec': S.pdQty=Math.max(0,S.pdQty-1); render(); document.getElementById('pdDec')?.focus(); break;
    case 'pdAdd': { const id=S.pdId, before=S.cart[id]||0, q=S.pdQty; if(q===0){ delete S.cart[id]; } else S.cart[id]=q; S.modal=null; render(); if(q>before) snack(id); else toast(q===0?'Removed from cart':'Cart updated'); } break;
    case 'xtraBtn': case 'acctBtn': case 'catBtn': case 'favBtn': toast('Favourites list isn\'t part of this prototype'); break;
    case 'toSlotGrid': S.modal='slot'; S.draft={...S.draft, day:S.day||'today', sday:S.day, slot:S.slot}; S.fromWhen=true; render(); break;
    case 'bufInfo': { const n=document.getElementById('bufNote'); n.hidden=!n.hidden; b.setAttribute('aria-expanded',String(!n.hidden)); } break;
    case 'addAddr': S.adding=true; S.editId=null; render(); setTimeout(()=>document.getElementById('na-label')?.focus(),0); break;
    case 'addCt': S.adding=true; S.editCid=null; render(); setTimeout(()=>document.getElementById('ct-first')?.focus(),0); break;
    case 'cancelCt': S.adding=false; S.editCid=null; render(); break;
    case 'cancelAddr': S.adding=false; S.editId=null; render(); break;
    case 'modalSave':
      if(S.modal==='addr') S.addr=S.draft.addr;
      if(S.modal==='contact') S.cid=S.draft.cid;
      if(S.modal==='pay') S.pay=S.draft.pay;
      if(S.modal==='slot'){ if(!S.draft.slot){ toast('Pick a delivery time first'); break; } S.day=S.draft.sday; S.slot=S.draft.slot; S.dmode=(S.day==='today'&&S.slot==='20:00–21:00')?'bundle':'custom'; }
      { const m=S.modal; closeModal(); toast(m==='contact'?'Contact updated':m==='addr'?'Delivery address updated':m==='slot'?'Delivery time updated':'Payment method updated'); }
      break;
    case 'snackView': document.getElementById('snack').hidden=true; S.drawer=true; render(); break;
    case 'aiFab': toast('Maia is not part of this prototype'); break;
    case 'themeBtn': setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'); break;
    case 'snackClose': document.getElementById('snack').hidden=true; break;
    case 'openCart': document.getElementById('snack').hidden=true; S.drawer=true; render(); break;
    case 'closeCart': case 'closeCart2': S.drawer=false; render(); break;
    case 'toCartPage': S.view='cart'; S.drawer=false; render(); window.scrollTo(0,0); break;
    case 'emptyCart': S.cart={}; render(); break;
    case 'toCheckout2':
    case 'toCheckout': S.view='checkout'; S.drawer=false; render(); window.scrollTo(0,0); break;
    case 'place': S.view='done'; render(); window.scrollTo(0,0); break;
    case 'home': e.preventDefault(); S.view='shop'; render(); break;
    case 'reset': case 'again': S=fresh(); render(); window.scrollTo(0,0); toast('Fresh first-time cart loaded'); break;
  }
});
document.getElementById('scrim').addEventListener('click',()=>{S.drawer=false;render();});
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if(S.modal){closeModal();return;} if(S.drawer){S.drawer=false;render();} });
document.addEventListener('click',e=>{ if(e.target.id==='mscrim') closeModal(); });
document.addEventListener('submit',e=>{ if(e.target.id==='promo'){ e.preventDefault(); const v=(e.target.promo.value||'').trim().toUpperCase(); if(!v){ toast('Enter a code first'); return; } toast(v==='WELCOME20'?'WELCOME20 is already applied':'That code isn’t valid. Check it and try again.'); e.target.promo.value=''; return; }
  if(e.target.id!=='newAddr') return; e.preventDefault(); const f=new FormData(e.target); const v=k=>(f.get(k)||'').toString().trim();
  if(!v('street')||!v('zip')||!v('city')){ const er=document.getElementById('naErr'); er.hidden=false; (!v('street')?document.getElementById('na-street'):!v('zip')?document.getElementById('na-zip'):document.getElementById('na-city')).focus(); return; }
  const data={label:v('label')||'Home',street:v('street'),zip:v('zip'),city:v('city'),note:v('note')};
  if(S.editId){ Object.assign(S.addrs.find(x=>x.id===S.editId),data); S.draft.addr=S.editId; }
  else { const id='a'+Date.now(); S.addrs.push({id,name:cur().name,...data}); S.draft.addr=id; }
  S.adding=false; S.editId=null; render(); toast('Address saved'); });
document.addEventListener('submit',e=>{ if(e.target.id!=='contactF') return; e.preventDefault(); const f=new FormData(e.target); const v=k=>(f.get(k)||'').toString().trim();
  if(!v('first')||!v('last')||v('phone').replace(/\D/g,'').length<6){ document.getElementById('ctErr').hidden=false; (!v('first')?document.getElementById('ct-first'):!v('last')?document.getElementById('ct-last'):document.getElementById('ct-phone')).focus(); return; }
  const data={first:v('first'),last:v('last'),phone:v('phone')};
  if(S.editCid){ Object.assign(S.contacts.find(x=>x.id===S.editCid),data); S.draft.cid=S.editCid; } else { const id='c'+Date.now(); S.contacts.push({id,...data}); S.draft.cid=id; }
  S.adding=false; S.editCid=null; render(); toast('Contact saved'); });
document.addEventListener('change',e=>{ if(e.target.name==='dmode'){ const q=QUICK[e.target.value]; S.dmode=e.target.value; S.day=q.day; S.slot=q.slot; render(); document.querySelector(`input[name=dmode][value=${S.dmode}]`)?.focus(); return; } if(e.target.name==='pay'){ S.pay=e.target.value; render(); document.querySelector(`input[name=pay][value=${S.pay}]`)?.focus(); return; } if(e.target.name==='maddr') S.draft.addr=e.target.value; if(e.target.name==='mct') S.draft.cid=e.target.value; if(e.target.name==='mpay') S.draft.pay=e.target.value; });
document.getElementById('q').addEventListener('input',e=>{ S.q=e.target.value; if(S.view!=='shop') S.view='shop'; document.getElementById('view').innerHTML=renderShop(); });
render();
</script>
